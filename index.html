<style>

  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; font-size: 14px; }

  .c-teal .val { color: #13c2c2; }

<script>
const API_BASE = 'https://twm-api.fly.dev';
const ACCOUNT_ID = '1558628995676725';
let trendChart, pieChart, ageChart, ageComboChart, genderChart, genderComboChart;
let lastFilteredTrend = [];
let lastTotal = null;
let dateGranularity = 'day';
let gadsTestTrendChart, gadsTestPieChart, gadsTestAgeChart, gadsTestAgeComboChart, gadsTestGenderChart, gadsTestGenderComboChart;
let gadsTestDateGranularity = 'day';
let lastGadsTestRaw = [];
let lastGadsTestHeadlineRaw = [];
let lastGadsTestDescriptionRaw = [];
const GOOGLE_AUTO_REFRESH_MS = 15 * 60 * 1000; // 15分鐘輪詢一次確保拿到新資料

function switchTab(name, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('tab-' + name + '-panel').classList.add('active');
}

async function refreshAll(force = false) {
  const btn = document.getElementById('fetchBtn');
  const status = document.getElementById('statusText');
  btn.disabled = true;
  status.textContent = '載入中…'; status.className = 'status-text';
  try {
    await Promise.all([fetchData(force), fetchGadsTestData(force)]);
    status.textContent = '✓ 完成'; status.className = 'status-text ok';
  } catch(e) {
    status.textContent = `❌ ${e.message}`; status.className = 'status-text err';
  } finally {
    btn.disabled = false;
  }
}

function toYMD(d) {
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// Immediately-preceding period of the same length, used for period-over-period (+/-) comparison.
function prevPeriodRange(since, until) {
  const s = new Date(since + 'T00:00:00');
  const u = new Date(until + 'T00:00:00');
  const days = Math.round((u - s) / 86400000) + 1;
  const prevUntil = new Date(s); prevUntil.setDate(prevUntil.getDate() - 1);
  const prevSince = new Date(prevUntil); prevSince.setDate(prevSince.getDate() - (days - 1));
  return { since: toYMD(prevSince), until: toYMD(prevUntil) };
}

// Sums the given numeric fields across rows — used to total both the current and previous period.
function sumFields(rows, fields) {
  const total = {};
  fields.forEach(f => total[f] = 0);
  for (const r of rows) fields.forEach(f => total[f] += (r[f] || 0));
  return total;
}

// Renders a small "+/-X.X%" line vs. the previous period. `invert` marks cost-per-x metrics
// (CPA/CPC/CPLC/CPM) where a decrease is the good direction, so green/red flip accordingly.
function deltaHtml(curr, prev, invert = false) {
  if (prev == null || !isFinite(prev) || prev === 0 || curr == null || !isFinite(curr)) return '';
  const pct = (curr - prev) / Math.abs(prev) * 100;
  if (!isFinite(pct)) return '';
  const flat = Math.abs(pct) < 0.05;
  const good = invert ? pct < 0 : pct > 0;
  const cls = flat ? 'flat' : (good ? 'up' : 'down');
  const sign = pct > 0 ? '+' : '';
  return `<div class="delta ${cls}">${sign}${pct.toFixed(1)}% <span style="font-weight:400;color:#bbb;">前期</span></div>`;
}

// Shared Chart.js tooltip formatter — rounds every value to a whole number (no decimals) and
// prefixes NT$ for money-type series (spend/revenue/cost-per-x labels).
function fmtTooltipValue(value, label) {
  const n = Math.round(value || 0).toLocaleString('zh-TW');
  const isMoney = /花費|營收|CPA|CPC|CPM|CPLC/.test(label || '');
  return isMoney ? `NT$${n}` : n;
}
function comboTooltipCallbacks() {
  return { label: (ctx) => `${ctx.dataset.label || ''}: ${fmtTooltipValue(ctx.parsed.y, ctx.dataset.label)}` };
}
function moneyDoughnutTooltipCallbacks() {
  return { label: (ctx) => `${ctx.label || ''}: ${fmtTooltipValue(ctx.parsed, '花費')}` };
}

// Draws a white "%"-of-total label centered on each slice of a doughnut/pie chart.
// Opted into per-chart via `plugins: [PIE_PERCENT_LABELS]` — not applied globally.
const PIE_PERCENT_LABELS = {
  id: 'piePercentLabels',
  afterDatasetsDraw(chart) {
    const meta = chart.getDatasetMeta(0);
    const data = chart.data.datasets[0]?.data || [];
    const total = data.reduce((s, v) => s + (v || 0), 0);
    if (total <= 0 || !meta?.data?.length) return;
    const { ctx } = chart;
    ctx.save();
    ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    meta.data.forEach((arc, i) => {
      const pct = (data[i] || 0) / total * 100;
      if (pct < 4) return; // too thin a slice to fit readable text
      const pos = arc.tooltipPosition();
      ctx.fillText(Math.round(pct) + '%', pos.x, pos.y);
    });
    ctx.restore();
  }
};

function clearPreset() {
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
}
function applyPreset(days) {
  const to = new Date(), from = new Date();
  from.setDate(to.getDate() - days + 1);
  document.getElementById('dateFrom').value = toYMD(from);
  document.getElementById('dateTo').value = toYMD(to);
  clearPreset(); event.target.classList.add('active');
  refreshAll(false);
}
function applyPresetYesterday() {
  const d = new Date(); d.setDate(d.getDate() - 1);
  document.getElementById('dateFrom').value = toYMD(d);
  document.getElementById('dateTo').value = toYMD(d);
  clearPreset(); event.target.classList.add('active');
  refreshAll(false);
}
function applyPresetMonth() {
  const now = new Date();
  document.getElementById('dateFrom').value = toYMD(new Date(now.getFullYear(), now.getMonth(), 1));
  document.getElementById('dateTo').value = toYMD(now);
  clearPreset(); event.target.classList.add('active');
  refreshAll(false);
}
(function() {
  const to = new Date(), from = new Date();
  from.setDate(to.getDate() - 6);
  document.getElementById('dateFrom').value = toYMD(from);
  document.getElementById('dateTo').value = toYMD(to);
  document.getElementById('preset7').classList.add('active');
  refreshAll(false);
  setInterval(() => fetchGadsTestData(true), GOOGLE_AUTO_REFRESH_MS);
})();

function cacheGet(key) {
  try { const v = sessionStorage.getItem(key); return v ? JSON.parse(v) : null; } catch(e) { return null; }
}
function cacheSet(key, val) {
  try { sessionStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
}
async function cachedFetchJson(url, force) {
  if (!force) {
    const cached = cacheGet('twmCache:' + url);
    if (cached) return cached;
  }
  const res = await fetch(force ? url + '&force=true' : url);
  const json = await res.json();
  cacheSet('twmCache:' + url, json);
  return json;
}

function showSectionError(wrapId, e) {
  const el = document.getElementById(wrapId);
  if (el) el.innerHTML = `<div style="text-align:center;padding:40px;color:#f5222d;">載入失敗：${e.message}</div>`;
}

async function fetchData(force = false) {
  const since = document.getElementById('dateFrom').value;
  const until = document.getElementById('dateTo').value;

  renderSkeleton();

  const base = `${API_BASE}/api/insights?accounts=${ACCOUNT_ID}&since=${since}&until=${until}`;
  const campP   = cachedFetchJson(`${base}&level=campaign`, force);
  const trendP  = cachedFetchJson(`${base}&level=account&time_increment=daily`, force);
  const adsetP  = cachedFetchJson(`${base}&level=adset`, force);
  const ageP    = cachedFetchJson(`${base}&level=account&breakdowns=age`, force);
  const genderP = cachedFetchJson(`${base}&level=account&breakdowns=gender`, force);

  const prev = prevPeriodRange(since, until);
  const prevBase = `${API_BASE}/api/insights?accounts=${ACCOUNT_ID}&since=${prev.since}&until=${prev.until}`;
  const prevCampP = cachedFetchJson(`${prevBase}&level=campaign`, force).catch(() => ({ data: [] }));

  // Progressive rendering: each section paints as soon as its own fetch resolves,
  // instead of the whole page waiting on the slowest of five calls.
  adsetP.then(j => renderAudience(j.data || [])).catch(e => showSectionError('adsetTableWrap', e));
  ageP.then(j => renderDemographic('age', j.data || [])).catch(e => showSectionError('ageTableWrap', e));
  genderP.then(j => renderDemographic('gender', j.data || [])).catch(e => showSectionError('genderTableWrap', e));

  const [campJson, trendJson, prevCampJson] = await Promise.all([campP, trendP, prevCampP]);
  const campData  = campJson.data || [];
  const trendData = trendJson.data || [];
  const prevCampData = prevCampJson.data || [];

  renderCore(campData, trendData, since, until, prevCampData);

  const updatedAt = campJson.updated || new Date().toLocaleString('zh-TW');
  document.getElementById('lastUpdate').textContent = updatedAt + (campJson.cached ? '（快取）' : '');
}

function fmtN(n, d=0) { if (n == null || isNaN(n)) return '<span class="na">—</span>'; return (+n).toLocaleString('zh-TW',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtM(n) { if (!n && n !== 0) return '<span class="na">—</span>'; return 'NT$'+Math.round(n).toLocaleString('zh-TW'); }
function fmtP(n) { if (n == null) return '<span class="na">—</span>'; return (+n).toFixed(2)+'%'; }

const PRODUCT_FIELDS = [
  { key: 'netflix_purchase', label: 'Netflix<br>Purchase' },
  { key: 'max_purchase',     label: 'Max<br>Purchase' },
  { key: 'newdp_purchase',   label: 'NewDP<br>Purchase' },
  { key: 'prime_purchase',   label: 'Prime<br>Purchase' },
  { key: 'ott_purchase',     label: 'OTT<br>Purchase' },
];

function loadingPlaceholder() {

}
function loadingCards(n) {

}

    <div class="charts-row">

        <h3>📅 每日趨勢</h3>
        <div style="display:flex;gap:16px;margin-bottom:8px;font-size:11px;">
          <span><span style="display:inline-block;width:12px;height:3px;background:#1677ff;border-radius:2px;vertical-align:middle;margin-right:4px"></span>花費</span>
          <span><span style="display:inline-block;width:12px;height:3px;background:#fa8c16;border-radius:2px;vertical-align:middle;margin-right:4px"></span>購買</span>
        </div>
        <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
      </div>

        <div class="chart-wrap"><canvas id="pieChart"></canvas></div>
      </div>
    </div>

      <div class="table-header">

}

const CORE_TOTAL_FIELDS = ['spend','impressions','link_clicks','view_content','purchase',
  'netflix_purchase','max_purchase','newdp_purchase','prime_purchase','ott_purchase'];

function renderCore(camps, trend, since, until, prevCamps = []) {
  const total = sumFields(camps, CORE_TOTAL_FIELDS);
  const cpa  = total.purchase > 0 ? total.spend/total.purchase : 0;

function aggregateByPeriod(rows, granularity) {
  if (granularity === 'day') {
    return [...rows].sort((a,b)=>a.date_start<b.date_start?-1:1).map(r => ({ ...r, label: r.date_start }));
  }
  const map = {};
  for (const r of rows) {
    const d = new Date(r.date_start + 'T00:00:00');
    let key, label;
    if (granularity === 'week') {
      const day = d.getDay();
      const monday = new Date(d); monday.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
      key = toYMD(monday);
      label = `${toYMD(monday).slice(5)} ~ ${toYMD(sunday).slice(5)}`;
    } else {
      key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      label = key;
    }
    if (!map[key]) map[key] = { label, date_start: key, spend:0, impressions:0, link_clicks:0, view_content:0, purchase:0,
      netflix_purchase:0, max_purchase:0, newdp_purchase:0, prime_purchase:0, ott_purchase:0 };
    const g = map[key];
    g.spend            += r.spend            || 0;
    g.impressions       += r.impressions       || 0;
    g.link_clicks       += r.link_clicks       || 0;
    g.view_content       += r.view_content       || 0;
    g.purchase          += r.purchase          || 0;
    g.netflix_purchase  += r.netflix_purchase  || 0;
    g.max_purchase      += r.max_purchase      || 0;
    g.newdp_purchase    += r.newdp_purchase    || 0;
    g.prime_purchase    += r.prime_purchase    || 0;
    g.ott_purchase      += r.ott_purchase      || 0;
  }
  return Object.keys(map).sort().map(k => {
    const g = map[k];
    return { ...g,
      ctr:  g.impressions > 0 ? g.link_clicks / g.impressions * 100 : 0,
      cplc: g.link_clicks > 0 ? g.spend / g.link_clicks : 0,
      cpm:  g.impressions > 0 ? g.spend / g.impressions * 1000 : 0,
      cpa:  g.purchase > 0 ? g.spend / g.purchase : 0,
    };
  });
}

function aggregateGoogleRows(rows) {
  const map = {};
  for (const r of rows) {
    const key = r.name || '—';
    if (!map[key]) map[key] = { name: key, spend: 0, impressions: 0, clicks: 0, conversions: 0, revenue: 0 };
    const g = map[key];
    g.spend       += r.spend       || 0;
    g.impressions += r.impressions || 0;
    g.clicks      += r.clicks      || 0;
    g.conversions += r.conversions || 0;
    g.revenue     += r.revenue     || 0;
  }
  return Object.values(map)
    .map(g => ({
      ...g,
      ctr: g.impressions > 0 ? g.clicks / g.impressions * 100 : 0,
      cpc: g.clicks > 0 ? g.spend / g.clicks : 0,
      cpa: g.conversions > 0 ? g.spend / g.conversions : 0,
      roas: g.spend > 0 ? g.revenue / g.spend : 0,
    }))
    .sort((a, b) => (b.spend || 0) - (a.spend || 0));
}

function aggregateGoogleByPeriod(rows, granularity) {
  if (granularity === 'day') {
    const map = {};
    for (const r of rows) {
      const key = r.date_start;
      if (!map[key]) map[key] = { label: key, date_start: key, spend: 0, impressions: 0, clicks: 0, conversions: 0 };
      const g = map[key];
      g.spend += r.spend || 0; g.impressions += r.impressions || 0; g.clicks += r.clicks || 0; g.conversions += r.conversions || 0;
    }
    return Object.keys(map).sort().map(k => finalizeGooglePeriod(map[k]));
  }
  const map = {};
  for (const r of rows) {
    const d = new Date(r.date_start + 'T00:00:00');
    let key, label;
    if (granularity === 'week') {
      const day = d.getDay();
      const monday = new Date(d); monday.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
      const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
      key = toYMD(monday);
      label = `${toYMD(monday).slice(5)} ~ ${toYMD(sunday).slice(5)}`;
    } else {
      key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      label = key;
    }
    if (!map[key]) map[key] = { label, date_start: key, spend: 0, impressions: 0, clicks: 0, conversions: 0 };
    const g = map[key];
    g.spend += r.spend || 0; g.impressions += r.impressions || 0; g.clicks += r.clicks || 0; g.conversions += r.conversions || 0;
  }
  return Object.keys(map).sort().map(k => finalizeGooglePeriod(map[k]));
}

function finalizeGooglePeriod(g) {
  return { ...g,
    ctr: g.impressions > 0 ? g.clicks / g.impressions * 100 : 0,
    cpc: g.clicks > 0 ? g.spend / g.clicks : 0,
    cpa: g.conversions > 0 ? g.spend / g.conversions : 0,
  };
}

          <select class="filter-select" id="gadsTestDescriptionCampFilter" onchange="renderGadsTestAssetTable('description')"><option value="">所有廣告活動</option></select>
          <span style="font-size:12px;color:#aaa;">依花費顯示前 10 筆</span>
        </div>
      </div>
      <div class="table-wrap" id="gadsTestDescriptionWrap">${loadingPlaceholder()}</div>
    </div>
    <div class="charts-row charts-row-rev">
      <div class="chart-card">
        <h3>🎂 花費分佈（年齡）</h3>
        <div class="chart-wrap"><canvas id="gadsTestAgeChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>📊 花費／購買次數（年齡）</h3>
        <div class="chart-wrap"><canvas id="gadsTestAgeComboChart"></canvas></div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-header"><h3>🎂 年齡分析</h3></div>
      <div class="table-wrap" id="gadsTestAgeTableWrap">${loadingPlaceholder()}</div>
    </div>
    <div class="charts-row charts-row-rev">
      <div class="chart-card">
        <h3>🚻 花費分佈（性別）</h3>
        <div class="chart-wrap"><canvas id="gadsTestGenderChart"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>📊 花費／購買次數（性別）</h3>
        <div class="chart-wrap"><canvas id="gadsTestGenderComboChart"></canvas></div>
      </div>
    </div>
    <div class="table-card">
      <div class="table-header"><h3>🚻 性別分析</h3></div>
      <div class="table-wrap" id="gadsTestGenderTableWrap">${loadingPlaceholder()}</div>
    </div>`;
}

async function fetchGadsTestData(force = false) {
  const since = document.getElementById('dateFrom').value;
  const until = document.getElementById('dateTo').value;
  renderGadsTestSkeleton();

  const base = `${API_BASE}/api/google_ads_direct?since=${since}&until=${until}`;
  const campP  = cachedFetchJson(`${base}&report=campaign`, force);
  const headP  = cachedFetchJson(`${base}&report=headline`, force);
  const descP  = cachedFetchJson(`${base}&report=description`, force);
  const ageP   = cachedFetchJson(`${base}&report=age`, force);
  const genderP = cachedFetchJson(`${base}&report=gender`, force);

  const prev = prevPeriodRange(since, until);
  const prevBase = `${API_BASE}/api/google_ads_direct?since=${prev.since}&until=${prev.until}`;
  const prevCampP = cachedFetchJson(`${prevBase}&report=campaign`, force).catch(() => ({ data: [] }));

  headP.then(j => { lastGadsTestHeadlineRaw = j.data || []; populateGadsTestCampFilter('headline'); renderGadsTestAssetTable('headline'); })
       .catch(e => showSectionError('gadsTestHeadlineWrap', e));
  descP.then(j => { lastGadsTestDescriptionRaw = j.data || []; populateGadsTestCampFilter('description'); renderGadsTestAssetTable('description'); })
       .catch(e => showSectionError('gadsTestDescriptionWrap', e));
  ageP.then(j => renderGadsTestDemographic('Age', j.data || [])).catch(e => showSectionError('gadsTestAgeTableWrap', e));
  genderP.then(j => renderGadsTestDemographic('Gender', j.data || [])).catch(e => showSectionError('gadsTestGenderTableWrap', e));

  const [json, prevJson] = await Promise.all([campP, prevCampP]);
  lastGadsTestRaw = json.data || [];
  const agg = aggregateGoogleRows(lastGadsTestRaw);
  const prevAgg = aggregateGoogleRows(prevJson.data || []);
  renderGadsTestSummary(agg, since, until, prevAgg);
  renderGadsTestCampaignPie(agg);
  renderGoogleTable('gadsTestCampaignWrap', '廣告活動', agg);
  renderGadsTestDateTable();
}

function populateGadsTestCampFilter(kind) {
  const rows = kind === 'headline' ? lastGadsTestHeadlineRaw : lastGadsTestDescriptionRaw;
  const sel = document.getElementById(`gadsTest${kind === 'headline' ? 'Headline' : 'Description'}CampFilter`);
  if (!sel) return;
  const camps = [...new Set(rows.map(r => r.campaign_name).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">所有廣告活動</option>` + camps.map(c => `<option value="${c}">${c}</option>`).join('');
}

function renderGadsTestAssetTable(kind) {
  const isHeadline = kind === 'headline';
  const raw = isHeadline ? lastGadsTestHeadlineRaw : lastGadsTestDescriptionRaw;
  const filterSel = document.getElementById(`gadsTest${isHeadline ? 'Headline' : 'Description'}CampFilter`);
  const campFilter = filterSel ? filterSel.value : '';
  const filtered = campFilter ? raw.filter(r => r.campaign_name === campFilter) : raw;
  const agg = aggregateGoogleRows(filtered).slice(0, 10);
  renderGoogleTable(isHeadline ? 'gadsTestHeadlineWrap' : 'gadsTestDescriptionWrap', isHeadline ? '標題' : '文案', agg);
}

function renderGadsTestDemographic(kind, rows) {
  const isAge = kind === 'Age';
  const order = isAge ? GOOGLE_AGE_ORDER : GOOGLE_GENDER_ORDER;
  const agg = aggregateGoogleRows(rows); // collapse the per-day rows into one row per bucket
  const orderedAgg = [...agg].sort((a,b) => {
    const ai = order.indexOf(a.name), bi = order.indexOf(b.name);
    return (ai < 0 ? 999 : ai) - (bi < 0 ? 999 : bi);
  });
  const total = orderedAgg.reduce((s,r)=>s+(r.spend||0), 0);
  const maxSpend = Math.max(...orderedAgg.map(r=>r.spend||0), 1);

  const wrap = document.getElementById(`gadsTest${kind}TableWrap`);
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>${isAge ? '年齡' : '性別'}</th><th>花費</th><th>佔比</th><th>曝光</th><th>點擊</th><th>CTR</th><th>CPC</th><th>購買<br>次數</th><th>CPA</th>
      </tr></thead>
      <tbody>${orderedAgg.map(r => {
        const pct = total > 0 ? (r.spend/total*100).toFixed(1) : '0';
        const bw = Math.round((r.spend||0)/maxSpend*80);
        return `<tr>
          <td><span class="cell-name">${r.name}</span></td>
          <td>${fmtM(r.spend)}</td>
          <td><div class="spend-bar-wrap"><span style="font-size:11px;color:#888">${pct}%</span><div class="spend-bar" style="width:${bw}px"></div></div></td>
          <td>${fmtN(r.impressions)}</td>
          <td>${fmtN(r.clicks)}</td>
          <td>${fmtP(r.ctr)}</td>
          <td>${fmtM(r.cpc)}</td>
          <td>${fmtN(r.conversions)}</td>
          <td>${fmtM(r.cpa)}</td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>`;

  const PIE_COLORS = ['#1677ff','#fa8c16','#52c41a','#eb2f96','#722ed1','#13c2c2','#fadb14'];
  const labels = orderedAgg.map(r => r.name);

  if (isAge) { if (gadsTestAgeChart) gadsTestAgeChart.destroy(); if (gadsTestAgeComboChart) gadsTestAgeComboChart.destroy(); }
  else       { if (gadsTestGenderChart) gadsTestGenderChart.destroy(); if (gadsTestGenderComboChart) gadsTestGenderComboChart.destroy(); }

  const doughnut = new Chart(document.getElementById(`gadsTest${kind}Chart`), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: orderedAgg.map(r=>r.spend||0), backgroundColor: PIE_COLORS, borderWidth: 2, borderColor: 'white' }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { font: { size: 10 }, boxWidth: 10, padding: 6 } }, tooltip: { callbacks: moneyDoughnutTooltipCallbacks() } } }
  });

  const combo = new Chart(document.getElementById(`gadsTest${kind}ComboChart`), {
    data: { labels, datasets: [
      { type: 'bar',  label: '花費', data: orderedAgg.map(r=>r.spend||0),       backgroundColor: 'rgba(22,119,255,0.25)', borderColor: '#1677ff', borderWidth: 1, yAxisID: 'y', borderRadius: 3 },
      { type: 'line', label: '購買次數', data: orderedAgg.map(r=>r.conversions||0), borderColor: '#fa8c16', borderWidth: 2, pointRadius: 3, tension: 0.3, yAxisID: 'y3' },
    ]},
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: comboTooltipCallbacks() } },
      scales: {
        x:  { grid: { display: false }, ticks: { font: { size: 10 } } },
        y:  { position: 'left',  beginAtZero: true, grid: { color: '#f0f2f5' }, ticks: { callback: v=>'NT$'+Math.round(v/1000)+'K', font: { size: 10 } } },
        y3: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { precision: 0, font: { size: 10 } } },
      }
    }
  });

  if (isAge) { gadsTestAgeChart = doughnut; gadsTestAgeComboChart = combo; }
  else       { gadsTestGenderChart = doughnut; gadsTestGenderComboChart = combo; }
}

const GADS_TOTAL_FIELDS = ['spend', 'impressions', 'clicks', 'conversions'];

function renderGadsTestSummary(agg, since, until, prevAgg = []) {
  const total = sumFields(agg, GADS_TOTAL_FIELDS);
  const ctr = total.impressions > 0 ? total.clicks / total.impressions * 100 : 0;
  const cpc = total.clicks > 0 ? total.spend / total.clicks : 0;
  const cpa = total.conversions > 0 ? total.spend / total.conversions : 0;

  const prevTotal = sumFields(prevAgg, GADS_TOTAL_FIELDS);
  const prevCpc = prevTotal.clicks > 0 ? prevTotal.spend / prevTotal.clicks : 0;
  const prevCpa = prevTotal.conversions > 0 ? prevTotal.spend / prevTotal.conversions : 0;

  document.getElementById('gadsTestSummaryGrid').innerHTML = `
    <div class="sc c-blue"><div class="lbl">花費</div><div class="val">${fmtM(total.spend)}</div><div class="sub">${since} ～ ${until}</div>${deltaHtml(total.spend, prevTotal.spend)}</div>
    <div class="sc"><div class="lbl">曝光</div><div class="val">${fmtN(total.impressions)}</div>${deltaHtml(total.impressions, prevTotal.impressions)}</div>
    <div class="sc c-purple"><div class="lbl">點擊</div><div class="val">${fmtN(total.clicks)}</div><div class="sub">CTR ${fmtP(ctr)}</div>${deltaHtml(total.clicks, prevTotal.clicks)}</div>
    <div class="sc"><div class="lbl">CPC</div><div class="val">${fmtM(cpc)}</div>${deltaHtml(cpc, prevCpc, true)}</div>
    <div class="sc c-teal"><div class="lbl">購買次數</div><div class="val">${fmtN(total.conversions)}</div>${deltaHtml(total.conversions, prevTotal.conversions)}</div>
    <div class="sc"><div class="lbl">CPA</div><div class="val">${fmtM(cpa)}</div>${deltaHtml(cpa, prevCpa, true)}</div>`;
}

function renderGadsTestCampaignPie(agg) {
  if (gadsTestPieChart) gadsTestPieChart.destroy();
  const PIE_COLORS = ['#1677ff','#fa8c16','#52c41a','#eb2f96','#722ed1','#13c2c2','#fadb14','#f5222d'];
  gadsTestPieChart = new Chart(document.getElementById('gadsTestPieChart'), {
    type: 'doughnut',
    data: { labels: agg.map(r => r.name.slice(0,16)), datasets: [{ data: agg.map(r => r.spend || 0), backgroundColor: PIE_COLORS, borderWidth: 2, borderColor: 'white' }] },
    plugins: [PIE_PERCENT_LABELS],
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right', labels: { font: { size: 10 }, boxWidth: 10, padding: 6 } }, tooltip: { callbacks: moneyDoughnutTooltipCallbacks() } } }
  });

  if (gadsTestTrendChart) gadsTestTrendChart.destroy();
  const daily = aggregateGoogleByPeriod(lastGadsTestRaw, 'day');
  gadsTestTrendChart = new Chart(document.getElementById('gadsTestTrendChart'), {
    data: { labels: daily.map(r => r.date_start), datasets: [
      { type: 'bar',  label: '花費', data: daily.map(r => r.spend || 0), backgroundColor: 'rgba(22,119,255,0.25)', borderColor: '#1677ff', borderWidth: 1, yAxisID: 'y', borderRadius: 3 },
      { type: 'line', label: '購買次數', data: daily.map(r => r.conversions || 0), borderColor: '#fa8c16', borderWidth: 2, pointRadius: 2, tension: 0.3, yAxisID: 'y3' },
    ]},
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false }, plugins: { legend: { display: false }, tooltip: { callbacks: comboTooltipCallbacks() } },
      scales: {
        x:  { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 10 } },
        y:  { position: 'left',  beginAtZero: true, grid: { color: '#f0f2f5' }, ticks: { callback: v=>'NT$'+Math.round(v/1000)+'K', font: { size: 10 } } },
        y3: { position: 'right', beginAtZero: true, grid: { display: false }, ticks: { precision: 0, font: { size: 10 } } },
      }
    }
  });
}

function setGadsTestGranularity(g) {
  gadsTestDateGranularity = g;
  document.querySelectorAll('#tab-gadsTest .table-header-right .preset-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGadsTestDateTable();
}

function renderGadsTestDateTable() {
  const wrap = document.getElementById('gadsTestDateTableWrap');
  if (!wrap) return;
  const periods = aggregateGoogleByPeriod(lastGadsTestRaw, gadsTestDateGranularity);
  const total = finalizeGooglePeriod(periods.reduce((a, r) => ({
    spend: a.spend + (r.spend||0), impressions: a.impressions + (r.impressions||0),
    clicks: a.clicks + (r.clicks||0), conversions: a.conversions + (r.conversions||0),
  }), { spend:0, impressions:0, clicks:0, conversions:0 }));

  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>日期</th><th>花費</th><th>曝光</th><th>點擊</th><th>CTR</th><th>CPC</th><th>購買<br>次數</th><th>CPA</th>
      </tr></thead>
      <tbody>${periods.map(r => `<tr>
        <td><span class="cell-name">${r.label}</span></td>
        <td>${fmtM(r.spend)}</td>
        <td>${fmtN(r.impressions)}</td>
        <td>${fmtN(r.clicks)}</td>
        <td>${fmtP(r.ctr)}</td>
        <td>${fmtM(r.cpc)}</td>
        <td>${fmtN(r.conversions)}</td>
        <td>${fmtM(r.cpa)}</td>
      </tr>`).join('')}
      <tr style="background:#f0f4ff;font-weight:700;border-top:2px solid #d0d9f0;">
        <td>合計</td>
        <td>${fmtM(total.spend)}</td>
        <td>${fmtN(total.impressions)}</td>
        <td>${fmtN(total.clicks)}</td>
        <td>${fmtP(total.ctr)}</td>
        <td>${fmtM(total.cpc)}</td>
        <td>${fmtN(total.conversions)}</td>
        <td>${fmtM(total.cpa)}</td>
      </tr>
      </tbody>
    </table>`;
}
